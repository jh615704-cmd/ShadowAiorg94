openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
security:
  - guestSession: []
tags:
  - name: health
    description: Health operations
  - name: deriv
    description: Deriv account and connection operations
  - name: token
    description: Deriv credential management
  - name: auth
    description: Current approved access
  - name: admin
    description: Administrator user management
  - name: access
    description: Access-key sessions and administrator access controls
paths:
  /healthz:
    get:
      security: []
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/access:
    get:
      security:
        - clerkSession: []
      operationId: getAuthAccess
      tags: [auth]
      summary: Get approved access for the current user
      responses:
        "200":
          description: Current approved identity and role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthAccess"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Signed in but not approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users:
    get:
      security:
        - clerkSession: []
      operationId: listAdminUsers
      tags: [admin]
      summary: List approved users
      responses:
        "200":
          description: Approved users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApprovedUser"
    post:
      security:
        - clerkSession: []
      operationId: createAdminUser
      tags: [admin]
      summary: Create an approved Clerk user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovedUser"
        "400":
          description: Invalid user or duplicate email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/intelligence/scan:
    get:
      security:
        - clerkSession: []
      operationId: scanAdminIntelligence
      tags: [admin]
      summary: Get the latest cross-feature diagnostic scan
      description: Returns sanitized, aggregated client diagnostics without account credentials, account IDs, trade payloads, or raw exception messages.
      responses:
        "200":
          description: Current scan of all trading features
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminIntelligenceScan"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /access/login:
    post:
      security: []
      operationId: loginAccessKey
      tags: [access]
      summary: Open an access-key session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessKeyLoginInput"
      responses:
        "200":
          description: Access session opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessSession"
        "400":
          description: Invalid access-key input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Access key not recognized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Access key paused, blocked, banned, or at its device limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /access/session:
    get:
      security:
        - accessSession: []
      operationId: getAccessSession
      tags: [access]
      summary: Get the current access-key session
      responses:
        "200":
          description: Current access session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessSession"
        "401":
          description: Access key session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /access/heartbeat:
    post:
      security:
        - accessSession: []
      operationId: heartbeatAccessSession
      tags: [access]
      summary: Update access-key presence
      responses:
        "200":
          description: Presence updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /access/logout:
    post:
      security:
        - accessSession: []
      operationId: logoutAccessSession
      tags: [access]
      summary: Close the current access-key session
      responses:
        "200":
          description: Session closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /access/diagnostics:
    post:
      security:
        - accessSession: []
      operationId: reportAccessDiagnostic
      tags: [access]
      summary: Report a sanitized feature diagnostic
      description: Accepts only an allowlisted feature and issue code; raw messages and trading data are never accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagnosticReportInput"
      responses:
        "202":
          description: Diagnostic accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticReportResponse"
        "400":
          description: Invalid diagnostic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Access session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /access/trading-protection:
    get:
      security:
        - accessSession: []
      operationId: getTradingProtection
      tags: [access]
      summary: Read administrator trading protection settings
      responses:
        "200":
          description: Global trading protection settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradingProtectionSettings"
        "403":
          description: Primary administrator access key required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      security:
        - accessSession: []
      operationId: updateTradingProtection
      tags: [access]
      summary: Update administrator trading protection settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradingProtectionSettingsUpdate"
      responses:
        "200":
          description: Updated global trading protection settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradingProtectionSettings"
        "403":
          description: Primary administrator access key required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /access/feature-settings:
    get:
      security:
        - accessSession: []
      operationId: getAdminFeatureSettings
      tags: [access]
      summary: Read feature availability and announcements
      responses:
        "200":
          description: Public feature availability and bot controls
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFeatureSettings"
    patch:
      security:
        - accessSession: []
      operationId: updateAdminFeatureSettings
      tags: [access]
      summary: Update feature availability and bot controls
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminFeatureSettingsUpdate"
      responses:
        "200":
          description: Updated feature availability and bot controls
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFeatureSettings"
        "400":
          description: Invalid feature settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Primary administrator access key required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /access/keys:
    get:
      security:
        - accessSession: []
      operationId: listAccessKeys
      tags: [access]
      summary: List access keys for administrators
      responses:
        "200":
          description: Access keys and presence
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccessKeySummary"
        "403":
          description: Administrator access key required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      security:
        - accessSession: []
      operationId: createAccessKey
      tags: [access]
      summary: Create a user or administrator access key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessKeyCreateInput"
      responses:
        "201":
          description: Access key created; the raw key is returned only once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessKeyCreated"
        "400":
          description: Invalid access-key settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The name is already used by another non-deleted access key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrator access key required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /access/keys/{id}:
    patch:
      security:
        - accessSession: []
      operationId: updateAccessKey
      tags: [access]
      summary: Pause, block, ban, or update an access key
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessKeyUpdateInput"
      responses:
        "200":
          description: Access key updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessKeySummary"
        "400":
          description: Invalid or irreversible access-key update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrator access key required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Access key not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      security:
        - accessSession: []
      operationId: deleteAccessKey
      tags: [access]
      summary: Delete an access key permanently
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Access key deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: The primary administrator key cannot be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrator access key required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Access key not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /access/keys/{id}/reset:
    post:
      security:
        - accessSession: []
      operationId: resetAccessKey
      tags: [access]
      summary: Issue a replacement access key
      description: Replaces an existing non-primary access key, revokes its sessions, and returns the new raw key only once.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Replacement access key; the raw key is returned only once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessKeyCreated"
        "400":
          description: The primary administrator key cannot be replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrator access key required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Access key not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /token/test:
    post:
      operationId: testDerivToken
      tags: [token]
      summary: Validate and save a Deriv personal access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DerivTokenInput"
      responses:
        "200":
          description: Validated token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivTokenTestResponse"
        "400":
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /token/status:
    get:
      operationId: getDerivTokenStatus
      tags: [token]
      summary: Get saved Deriv token metadata
      responses:
        "200":
          description: Token status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivTokenStatus"
  /token:
    delete:
      operationId: deleteDerivToken
      tags: [token]
      summary: Remove saved Deriv token
      responses:
        "200":
          description: Token removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenDeleteResponse"
  /deriv/accounts:
    get:
      operationId: getDerivAccounts
      tags: [deriv]
      summary: Load Deriv Options accounts
      description: Loads the accounts available to the configured Deriv PAT without exposing credentials.
      responses:
        "200":
          description: Available accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DerivAccount"
        "502":
          description: Deriv account service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /deriv/status:
    get:
      operationId: getDerivStatus
      tags: [deriv]
      summary: Get Deriv connection status
      parameters:
        - name: refresh_open_contracts
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Current connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivStatus"
        "502":
          description: Deriv could not refresh account status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Deriv session capacity is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /deriv/events:
    get:
      operationId: streamDerivTradeUpdates
      tags: [deriv]
      summary: Stream account history, live trades, and optional market ticks
      description: Sends an account-scoped history snapshot followed by trade-update events over Server-Sent Events. Set market_ticks=true to also receive a market-tick-snapshot followed by live market-tick events for the Auto Trader scanner.
      parameters:
        - name: market_ticks
          in: query
          required: false
          description: Include real Deriv tick updates for the Auto Trader scanner.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Server-Sent Events stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/DerivTradeEventStream"
        "401":
          description: Access session or Deriv credential required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Trading feature access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /deriv/test-connection:
    post:
      operationId: testDerivConnection
      tags: [deriv]
      summary: Test the Deriv REST and WebSocket connection
      responses:
        "200":
          description: Connection test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivConnectionTest"
        "502":
          description: Deriv connection failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /deriv/proposals:
    post:
      operationId: requestDerivProposal
      tags: [deriv]
      summary: Request a Deriv proposal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DerivProposalInput"
      responses:
        "202":
          description: Proposal request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivProposalRequest"
        "400":
          description: Invalid proposal input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: Deriv did not return a proposal after connection recovery attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /deriv/edge-available-durations:
    post:
      operationId: getEdgeAvailableDurations
      tags: [deriv]
      summary: Check which EDGE tick durations Deriv currently quotes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EdgeDurationAvailabilityInput"
      responses:
        "200":
          description: Durations that returned a current Deriv proposal; no trade is placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EdgeDurationAvailability"
        "400":
          description: Invalid duration availability request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Deriv availability check failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /deriv/accumulator-knockout-scan:
    post:
      operationId: scanDerivAccumulatorKnockout
      tags: [deriv]
      summary: Start or check the live Money Bank knockout scanner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoneyBankKnockoutScannerInput"
      responses:
        "200":
          description: Current live scanner progress for the selected Money Bank setup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoneyBankKnockoutScannerResponse"
        "400":
          description: Invalid Accumulator scan input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Money Bank feature access is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The scanner could not verify the selected market or quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /deriv/accumulator-knockout-statistics:
    get:
      operationId: getMoneyBankKnockoutStatistics
      tags: [deriv]
      summary: Compare Money Bank knockout estimates with later live samples
      description: Uses current Deriv Accumulator barriers and a held-out split of recent live quotes. It never places a trade or gates entry.
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            pattern: "^1HZ(10|15|25|30|50|75|90|100)V$"
        - name: amount
          in: query
          required: true
          schema:
            type: number
            minimum: 1
        - name: duration
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 30
      responses:
        "200":
          description: Rate-specific model estimates and their later-sample observations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoneyBankKnockoutStatistics"
        "400":
          description: Invalid Money Bank statistics request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Money Bank feature access is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Deriv statistics could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /deriv/select-account:
    post:
      operationId: selectDerivAccount
      tags: [deriv]
      summary: Select the account used by the authenticated WebSocket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DerivAccountSelection"
      responses:
        "200":
          description: Account selected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivStatus"
        "400":
          description: Invalid account selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /deriv/select-symbol:
    post:
      operationId: selectDerivSymbol
      tags: [deriv]
      summary: Select the market used for live digit telemetry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DerivSymbolSelection"
      responses:
        "200":
          description: Selected market status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivStatus"
        "400":
          description: Unsupported market
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Unable to connect to the selected account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /deriv/buy:
    post:
      operationId: buyDerivContract
      tags: [deriv]
      summary: Request a fresh proposal and buy immediately
      description: Requests a fresh proposal for the selected duration and digit contract, then buys it immediately. Real-account orders require the live-trading server flag and account-level funds checks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DerivBuyInput"
      responses:
        "202":
          description: Buy request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivBuyResponse"
        "400":
          description: Invalid buy request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Live trading is disabled or the selected account is not allowed to buy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Buy cooldown is active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: Deriv did not return a proposal after connection recovery attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /deriv/bulk-buy:
    post:
      operationId: bulkBuyDerivContracts
      tags: [deriv]
      summary: Buy a batch of digit contracts immediately
      description: Requests and sends 1 to 6 contracts without the single-trade cooldown. The total requested stake must fit within the selected account balance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DerivBulkBuyInput"
      responses:
        "202":
          description: Bulk buy requests accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivBulkBuyResponse"
        "400":
          description: Invalid bulk buy request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Live trading is disabled or the selected account is not allowed to buy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: Deriv did not return a proposal after connection recovery attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /deriv/jackpot/buy:
    post:
      operationId: buyJackpotPairs
      tags: [deriv]
      summary: Buy a Jackpot contract batch
      description: Accepts a selected list of 1–20 Rise/Fall and/or Even/Odd contracts, or the legacy complete-pair request. Requests fresh proposals for every contract before any buy is sent. Partial acknowledgements are returned explicitly and uncertain orders must be checked in Deriv history before resubmitting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JackpotPairBuyInput"
      responses:
        "202":
          description: Jackpot pair buy requests accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivBulkBuyResponse"
        "400":
          description: Invalid Jackpot buy request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Live trading is disabled or the selected account is not allowed to buy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Another Deriv contract is still open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Deriv could not return fresh proposals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /deriv/clock-work/quotes:
    post:
      operationId: quoteClockWorkContracts
      tags: [deriv]
      summary: Request live Higher and Lower contract quotes for Clock Work
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClockWorkBatchInput"
      responses:
        "200":
          description: Fresh proposal prices for the requested Clock Work contracts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClockWorkQuoteResponse"
        "400":
          description: Invalid Clock Work quote request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Deriv could not return a complete fresh quote set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /deriv/clock-work/buy:
    post:
      operationId: buyClockWorkContracts
      tags: [deriv]
      summary: Buy one to four Clock Work Higher and Lower contracts
      description: Requests fresh proposals for every contract before sending any buy. Partial acknowledgements are returned explicitly; an unconfirmed buy must not be replayed until Deriv history is checked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClockWorkBatchInput"
      responses:
        "202":
          description: Clock Work buy requests sent; inspect completed and failed entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClockWorkBatchBuyResponse"
        "400":
          description: Invalid Clock Work buy request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Live trading is disabled or the selected account is not allowed to buy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Another Deriv contract is still open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Deriv could not return fresh proposals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /deriv/sell:
    post:
      operationId: sellDerivContract
      tags: [deriv]
      summary: Close an open Deriv contract at the current sell price
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DerivSellInput"
      responses:
        "200":
          description: Contract close confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivSellResponse"
        "400":
          description: Invalid contract close request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: Deriv did not confirm the contract close
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /deriv/dual-buy:
    post:
      operationId: dualBuyDerivContracts
      tags: [deriv]
      summary: Buy one Over and one Under contract as a single action
      description: Requests and sends one Over and one Under digit contract without the single-trade cooldown. The pair uses the selected barrier and stake.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DerivDualBuyInput"
      responses:
        "202":
          description: Dual buy requests accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivBulkBuyResponse"
        "400":
          description: Invalid dual buy request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Live trading is disabled or the selected account is not allowed to buy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: Deriv did not return a proposal after connection recovery attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /deriv/history:
    get:
      operationId: getDerivHistory
      tags: [deriv]
      summary: Get Deriv trade history observed for real and demo accounts
      parameters:
        - name: require_fresh
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Trade history
          headers:
            X-Deriv-History-Stale:
              description: "true when the response uses this account's cached history because Deriv temporarily could not refresh it"
              schema:
                type: string
                enum: ["true", "false"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivHistoryResponse"
        "503":
          description: A fresh Deriv history snapshot is not available yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: clearDerivHistory
      tags: [deriv]
      summary: Clear recent trade rows from the dashboard
      description: Clears the dashboard's locally held recent rows. This does not delete records from Deriv.
      responses:
        "200":
          description: Recent rows cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivHistoryClearResponse"
components:
  securitySchemes:
    guestSession:
      type: apiKey
      in: cookie
      name: jdy_guest
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
      description: Clerk browser session cookie
    accessSession:
      type: apiKey
      in: cookie
      name: jdy_access
      description: HttpOnly access-key session cookie
  schemas:
    AuthAccess:
      type: object
      required: [user_id, email, role]
      properties:
        user_id: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, user] }
    ApprovedUser:
      type: object
      required: [user_id, email, role, active, created_at]
      properties:
        user_id: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, user] }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
    AdminUserInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 72 }
    DiagnosticCode:
      type: string
      enum: [client_runtime_error, client_unhandled_rejection, api_server_error, trade_outcome_uncertain, saved_state_invalid, storage_unavailable]
    DiagnosticSeverity:
      type: string
      enum: [warning, error]
    DiagnosticSource:
      type: string
      enum: [browser_app, api_server, deriv, transport, unknown]
    TradeBuyFailureOutcome:
      type: string
      enum: [rejected, uncertain, not_sent]
    DiagnosticReportInput:
      type: object
      required: [feature, code, severity]
      properties:
        feature:
          $ref: "#/components/schemas/AccessFeature"
        code:
          $ref: "#/components/schemas/DiagnosticCode"
        severity:
          $ref: "#/components/schemas/DiagnosticSeverity"
        source:
          $ref: "#/components/schemas/DiagnosticSource"
    DiagnosticReportResponse:
      type: object
      required: [accepted]
      properties:
        accepted: { type: boolean }
    AdminIntelligenceFeatureStatus:
      type: object
      required: [feature, status, open_findings]
      properties:
        feature:
          $ref: "#/components/schemas/AccessFeature"
        status: { type: string, enum: [clear, issue] }
        open_findings: { type: integer, minimum: 0 }
    AdminIntelligenceFinding:
      type: object
      required: [id, feature, code, severity, source, summary, guidance, first_seen_at, last_seen_at, occurrences, affected_sessions, fix_available]
      properties:
        id: { type: string }
        feature:
          $ref: "#/components/schemas/AccessFeature"
        code:
          $ref: "#/components/schemas/DiagnosticCode"
        severity:
          $ref: "#/components/schemas/DiagnosticSeverity"
        source:
          $ref: "#/components/schemas/DiagnosticSource"
        summary: { type: string }
        guidance: { type: string }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        occurrences: { type: integer, minimum: 1 }
        affected_sessions: { type: integer, minimum: 1 }
        fix_available: { type: boolean }
    AdminIntelligenceScan:
      type: object
      required: [scanned_at, server_status, features, findings]
      properties:
        scanned_at: { type: string, format: date-time }
        server_status: { type: string, enum: [healthy] }
        features:
          type: array
          items:
            $ref: "#/components/schemas/AdminIntelligenceFeatureStatus"
        findings:
          type: array
          items:
            $ref: "#/components/schemas/AdminIntelligenceFinding"
    AccessKeyLoginInput:
      type: object
      required: [access_key, device_id]
      properties:
        access_key: { type: string, minLength: 12, maxLength: 200 }
        device_id: { type: string, minLength: 8, maxLength: 200 }
    AccessKeyCreateInput:
      type: object
      required: [label, kind, max_devices, features]
      properties:
        label: { type: string, minLength: 1, maxLength: 120 }
        kind: { type: string, enum: [admin, user] }
        max_devices:
          type: integer
          minimum: 0
          maximum: 50
          description: "Maximum active devices; 0 means unlimited and is allowed only for administrator keys."
        features:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AccessFeature"
    AccessKeyUpdateInput:
      type: object
      properties:
        status: { type: string, enum: [active, paused, blocked, banned, deleted] }
        max_devices:
          type: integer
          minimum: 0
          maximum: 50
          description: "Maximum active devices; 0 means unlimited and is allowed only for administrator keys."
        features:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AccessFeature"
    AccessFeature:
      type: string
      enum: [edge, digit-flip, trade-x, bulk-trader, jackpot, clock-work, cash-grab, money-bank, jdy-ai-3, auto-trader, auto-trader-2, speedbot, settings, history, admin]
    AccessSession:
      type: object
      required: [key_id, key_prefix, label, kind, is_admin, status, max_devices, features, online, last_seen_at]
      properties:
        key_id: { type: string, format: uuid }
        key_prefix: { type: string }
        label: { type: string }
        kind: { type: string, enum: [admin, user] }
        is_admin: { type: boolean }
        status: { type: string, enum: [active, paused, blocked, banned] }
        max_devices: { type: integer }
        features:
          type: array
          items:
            $ref: "#/components/schemas/AccessFeature"
        online: { type: boolean }
        last_seen_at: { type: ["string", "null"], format: date-time }
    AccessKeySummary:
      allOf:
        - $ref: "#/components/schemas/AccessSession"
        - type: object
          required: [access_key, device_count, online_devices, offline_seconds, created_at]
          properties:
            access_key: { type: ["string", "null"] }
            device_count: { type: integer }
            online_devices: { type: integer }
            offline_seconds: { type: integer }
            created_at: { type: string, format: date-time }
            device_sessions:
              type: array
              items:
                $ref: "#/components/schemas/AccessDeviceSummary"
    AccessDeviceSummary:
      type: object
      required: [label, browser, operating_system, device_type, form_factor, online, first_seen_at, last_seen_at]
      properties:
        label: { type: string }
        browser: { type: string }
        operating_system: { type: string }
