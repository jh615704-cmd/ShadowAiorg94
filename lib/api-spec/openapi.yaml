    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    DerivAccount:
      type: object
      required: [id, type, currency, balance, status]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [demo, real]
        currency:
          type: string
        balance:
          type: number
        status:
          type: string
    DerivTick:
      type: object
      required: [symbol, quote, epoch]
      properties:
        symbol:
          type: string
        quote:
          type: number
        epoch:
          type: integer
    DerivProposal:
      type: object
      required: [id, ask_price, payout, spot]
      properties:
        id:
          type: string
        ask_price:
          type: number
        payout:
          type: number
        spot:
          type: number
        longcode:
          type: [string, "null"]
    DerivStatus:
      type: object
      required: [connected, authorized, bot_running, symbol, currency, max_trade_amount, market_signals, open_contracts_ready, active_contract_count]
      properties:
        connected:
          type: boolean
        authorized:
          type: boolean
        account:
          anyOf:
            - $ref: "#/components/schemas/DerivAccount"
            - type: "null"
        last_tick:
          anyOf:
            - $ref: "#/components/schemas/DerivTick"
            - type: "null"
        last_proposal:
          anyOf:
            - $ref: "#/components/schemas/DerivProposal"
            - type: "null"
        last_buy:
          anyOf:
            - $ref: "#/components/schemas/DerivBuy"
            - type: "null"
        last_contract:
          anyOf:
            - $ref: "#/components/schemas/DerivContract"
            - type: "null"
        open_contracts_ready:
          type: boolean
          description: Whether the current account's open-contract portfolio has been checked on this WebSocket connection.
        active_contract_count:
          type: integer
          minimum: 0
          description: Number of contracts the server currently considers open for the selected account.
        bot_running:
          type: boolean
        symbol:
          type: string
        currency:
          type: string
        max_trade_amount:
          type: number
        live_trading_enabled:
          type: boolean
        digit_even_percentage:
          type: number
        digit_odd_percentage:
          type: number
        digit_sample_count:
          type: integer
        last_digit:
          type: [integer, "null"]
          minimum: 0
          maximum: 9
        digit_history:
          type: array
          maxItems: 50
          items:
            type: integer
            minimum: 0
            maximum: 9
        digit_streaks:
          type: array
          items:
            $ref: "#/components/schemas/DigitStreak"
        market_signals:
          type: array
          items:
            $ref: "#/components/schemas/DerivMarketSignal"
    DigitStreak:
      type: object
