          minimum: 0
          maximum: 9
        over_percentage:
          type: number
          minimum: 0
          maximum: 100
        under_percentage:
          type: number
          minimum: 0
          maximum: 100
    DerivConnectionTest:
      type: object
      required: [ok, message, accounts, status]
      properties:
        ok:
          type: boolean
        message:
          type: string
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/DerivAccount"
        status:
          $ref: "#/components/schemas/DerivStatus"
    DerivProposalInput:
