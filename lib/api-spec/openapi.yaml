        features:
          type: array
          items: { $ref: "#/components/schemas/FeatureControl" }
        action_controls:
          type: array
          items: { $ref: "#/components/schemas/FeatureActionControl" }
        global_announcement_enabled: { type: boolean }
        global_announcement: { type: string, maxLength: 500 }
        global_announcement_revision: { type: string, maxLength: 128 }
        auto_trader_2_paused: { type: boolean }
        auto_trader_2_pause_message: { type: string, maxLength: 300 }
    SuccessResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
    DerivTokenInput:
      type: object
      required: [token]
      properties:
