          maximum: 30
        quote_count:
          type: integer
          minimum: 0
          maximum: 200
        tick_sequence:
          type: integer
          minimum: 0
        window_start_epoch:
          type: [integer, "null"]
          minimum: 0
        window_end_epoch:
          type: [integer, "null"]
          minimum: 0
        captured_at_epoch:
          type: integer
          minimum: 0
        tick_age_seconds:
          type: [integer, "null"]
          minimum: 0
        freshness:
          type: string
