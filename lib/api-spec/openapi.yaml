        amount:
          type: number
          exclusiveMinimum: 0
        duration:
          type: integer
          minimum: 1
          maximum: 10
          description: Tick duration; CALL and PUT allow 1–10, other contract types are limited to 1–5.
        duration_unit:
          type: string
          enum: [t]
        contract_type:
          type: string
          enum: [DIGITEVEN, DIGITODD, DIGITOVER, DIGITUNDER, DIGITDIFF, CALL, PUT, ACCU]
        barrier:
          type: integer
          minimum: 0
          maximum: 9
