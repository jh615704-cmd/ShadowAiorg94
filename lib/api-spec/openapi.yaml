        global_announcement_enabled: { type: boolean }
        global_announcement: { type: string, maxLength: 500 }
        global_announcement_revision: { type: string, maxLength: 128 }
        auto_trader_2_paused: { type: boolean }
        auto_trader_2_pause_message: { type: string, maxLength: 300 }
        updated_at: { type: ["string", "null"], format: date-time }
    AdminFeatureSettingsUpdate:
