        recent_quotes:
          type: array
          maxItems: 200
          items:
            type: number
          description: Most recent market quotes, in arrival order, for evaluating configured tick windows.
        tick_epoch:
          type: integer
          minimum: 0
          description: Epoch in seconds of the latest quote received for this market.
        sample_count:
          type: integer
          minimum: 0
        digit_even_percentage:
          type: number
          minimum: 0
          maximum: 100
        digit_odd_percentage:
          type: number
          minimum: 0
          maximum: 100
        rise_percentage:
          type: number
          minimum: 0
          maximum: 100
        fall_percentage:
          type: number
          minimum: 0
          maximum: 100
        digit_streaks:
          type: array
          items:
