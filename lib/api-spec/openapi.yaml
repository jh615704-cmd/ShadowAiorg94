        barrier:
          type: integer
          minimum: 0
          maximum: 9
        growth_rate:
          type: number
          minimum: 0.01
          maximum: 0.05
        symbol:
          type: string
    EdgeDurationAvailabilityInput:
      type: object
      required: [access_feature, amount, contract_type, barrier, symbol]
      properties:
        access_feature:
          type: string
          enum: [edge]
        amount:
          type: number
          exclusiveMinimum: 0
        contract_type:
          type: string
          enum: [DIGITOVER, DIGITUNDER]
        barrier:
          type: integer
          minimum: 0
          maximum: 9
        symbol:
          type: string
          minLength: 1
    MoneyBankKnockoutScannerInput:
      type: object
      required: [action, amount, duration, duration_unit, contract_type, growth_rate, symbol, required_knockouts]
      properties:
        action:
          type: string
          enum: [start, poll, reset]
        amount:
          type: number
          exclusiveMinimum: 0
        duration:
          type: integer
          minimum: 5
          maximum: 50
          description: Selected Accumulator duration, used when requesting the proposal barrier.
        duration_unit:
          type: string
          enum: [t]
        contract_type:
          type: string
          enum: [ACCU]
        growth_rate:
          type: number
          minimum: 0.01
          maximum: 0.05
        symbol:
          type: string
        required_knockouts:
          type: integer
          minimum: 1
          maximum: 20
    MoneyBankKnockoutScannerResponse:
      type: object
      required: [ok, message, phase, symbol, qualified_knockouts, required_knockouts, tick_sequence, ready_to_trade, market_matches]
      properties:
        ok:
          type: boolean
        message:
          type: string
        phase:
          type: string
          enum: [idle, waiting_for_market, waiting_for_quote, waiting_for_knockout, ready]
        symbol:
          type: string
        qualified_knockouts:
          type: integer
          minimum: 0
        required_knockouts:
          type: integer
          minimum: 1
          maximum: 20
        tick_sequence:
          type: integer
          minimum: 0
        ready_to_trade:
          type: boolean
        market_matches:
          type: boolean
    MoneyBankKnockoutStatisticsRate:
      type: object
      required: [growth_rate, barrier, status, training_windows, training_knockouts, holdout_windows, observed_knockouts, estimated_knockouts, estimate_lower_count, estimate_upper_count, estimated_knockout_rate, observed_knockout_rate, holdout_gap_percentage_points, message]
      properties:
        growth_rate:
          type: integer
          enum: [1, 2, 3, 4, 5]
        barrier:
          type: [number, "null"]
        status:
          type: string
          enum: [ready, insufficient_evidence, barrier_unavailable, waiting_for_quote, stale_data]
        training_windows:
          type: integer
          minimum: 0
        training_knockouts:
          type: integer
